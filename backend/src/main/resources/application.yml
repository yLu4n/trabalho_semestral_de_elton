spring:
  application:
    name: finai
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:55432/finai}
    username: ${DATABASE_USER:finai}
    password: ${DATABASE_PASSWORD}
    hikari:
      maximum-pool-size: 20
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  mail:
    host: ${SMTP_HOST:localhost}
    port: ${SMTP_PORT:1025}
    username: ${SMTP_USER:}
    password: ${SMTP_PASSWORD:}
    properties:
      mail.smtp.auth: ${SMTP_AUTH:false}
      mail.smtp.starttls.enable: ${SMTP_TLS:false}
      mail.smtp.connectiontimeout: 5000
      mail.smtp.timeout: 5000
  jackson:
    deserialization:
      fail-on-unknown-properties: true
server:
  address: ${SERVER_ADDRESS:127.0.0.1}
  port: 8080
  error:
    include-message: never
  forward-headers-strategy: framework
  servlet:
    session:
      cookie:
        secure: ${COOKIE_SECURE:false}
management:
  health:
    mail:
      enabled: ${SMTP_HEALTH_ENABLED:false}
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
finai:
  secret: ${SESSION_SECRET}
  cookie-secure: ${COOKIE_SECURE:false}
  public-url: ${PUBLIC_URL:http://localhost:4200}
  mail-mode: ${MAIL_MODE:file}
  mail-from: ${MAIL_FROM:nao-responda@finai.local}
  ai:
    endpoint: ${AI_ENDPOINT:https://api.openai.com/v1/chat/completions}
    key: ${AI_API_KEY:}
    model: ${AI_MODEL:gpt-4.1-mini}
    input-cost-per-million: ${AI_INPUT_COST:0}
    output-cost-per-million: ${AI_OUTPUT_COST:0}
